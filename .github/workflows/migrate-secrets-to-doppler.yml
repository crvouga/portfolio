name: Migrate Secrets to Doppler

on:
  workflow_dispatch:
    inputs:
      doppler_project:
        description: "Doppler project name"
        required: true
      doppler_config:
        description: "Doppler config (e.g. dev, staging, prd)"
        required: true
        default: "prd"

jobs:
  migrate-to-doppler:
    runs-on: ubuntu-latest
    env:
      SECRET_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SECRET_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SECRET_CLOUDFLARE_SECRETS_STORE_ID: ${{ secrets.CLOUDFLARE_SECRETS_STORE_ID }}
      SECRET_DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      SECRET_DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      SECRET_DO_TOKEN: ${{ secrets.DO_TOKEN }}
      SECRET_FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      SECRET_GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      SECRET_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SECRET_OPENAI_PROJECT_ID: ${{ secrets.OPENAI_PROJECT_ID }}
      SECRET_TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
      SECRET_TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
      SECRET_TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      SECRET_TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      SECRET_TWILIO_SERVICE_SID: ${{ secrets.TWILIO_SERVICE_SID }}

    steps:
      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Authenticate Doppler
        run: doppler configure set token "${{ secrets.DOPPLER_SERVICE_TOKEN }}"

      - name: Upload secrets to Doppler
        run: |
          PROJECT="${{ github.event.inputs.doppler_project }}"
          CONFIG="${{ github.event.inputs.doppler_config }}"

          echo "Migrating 15 secrets to Doppler project=$PROJECT config=$CONFIG"

          while IFS='=' read -r key value; do
            if [[ "$key" == SECRET_* ]]; then
              doppler_key="${key#SECRET_}"
              echo "Uploading: $doppler_key"
              doppler secrets set "$doppler_key"="$value" \
                --project "$PROJECT" \
                --config "$CONFIG"
            fi
          done < <(env)

          echo "Done. Verify at https://dashboard.doppler.com"