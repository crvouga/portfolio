name: Build And Publish Images

# Build a Docker image for every deploy target in `projects.ts` and push it to
# GitHub Container Registry (`ghcr.io/<owner>/chrisvouga-<id>`). No platform-
# specific wrappers — the same image is consumed verbatim by Fly.io.

on:
  push:
    branches:
      - main
    paths:
      - "projects.ts"
      - "Dockerfile"
      - "nginx.conf"
      - "fly/fly.toml.template"
      - "scripts/generate-deploy-matrix.ts"
      - ".github/workflows/build-and-publish-images.yml"
  workflow_dispatch:
    inputs:
      project_id:
        description: "Build a single project id (matches `projects.ts`); leave blank to build all."
        required: false
        type: string

concurrency:
  group: build-and-publish-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  configure:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - id: matrix
        env:
          PROJECT_ID: ${{ inputs.project_id }}
          GHCR_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          MATRIX=$(bun run scripts/generate-deploy-matrix.ts --owner "$GHCR_OWNER")
          if [ -n "${PROJECT_ID:-}" ]; then
            MATRIX=$(echo "$MATRIX" | jq --arg pid "$PROJECT_ID" '.include |= map(select(.id == $pid))')
            COUNT=$(echo "$MATRIX" | jq '.include | length')
            if [ "$COUNT" = "0" ]; then
              echo "::error::No project matched id: $PROJECT_ID"
              exit 1
            fi
          fi
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: configure
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.configure.outputs.matrix) }}
    steps:
      - name: Checkout portfolio (this repository)
        uses: actions/checkout@v5

      - name: Checkout ${{ matrix.checkout_repo }}
        if: ${{ matrix.checkout_repo != '' }}
        uses: actions/checkout@v5
        with:
          repository: ${{ matrix.checkout_repo }}
          path: ${{ matrix.checkout_path }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          set -euo pipefail
          REPO="${{ matrix.image_repo }}"
          docker buildx build \
            --platform linux/amd64 \
            --file "${{ matrix.dockerfile }}" \
            --tag "${REPO}:latest" \
            --tag "${REPO}:${{ github.sha }}" \
            --provenance=false \
            --push \
            "${{ matrix.build_context }}"
          echo "Pushed ${REPO}:latest and ${REPO}:${{ github.sha }}"
