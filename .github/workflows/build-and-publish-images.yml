name: Build And Publish Images

on:
  push:
    branches:
      - main
    paths:
      - "projects.ts"
      - "Dockerfile"
      - "nginx.conf"
      - "aws/lambda-wrapper.Dockerfile"
      - "scripts/generate-aws-deploy-matrix.ts"
      - ".github/workflows/build-and-publish-images.yml"
  workflow_dispatch:
    inputs:
      project_id:
        description: "Build a single project id (matches `projects.ts`); leave blank to build all."
        required: false
        type: string

concurrency:
  group: build-and-publish-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  configure:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - id: matrix
        env:
          PROJECT_ID: ${{ inputs.project_id }}
        run: |
          set -euo pipefail
          MATRIX=$(bun run scripts/generate-aws-deploy-matrix.ts)
          if [ -n "${PROJECT_ID:-}" ]; then
            MATRIX=$(echo "$MATRIX" | jq --arg pid "$PROJECT_ID" '.include |= map(select(.id == $pid))')
            COUNT=$(echo "$MATRIX" | jq '.include | length')
            if [ "$COUNT" = "0" ]; then
              echo "::error::No project matched id: $PROJECT_ID"
              exit 1
            fi
          fi
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: configure
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.configure.outputs.matrix) }}
    steps:
      - name: Checkout portfolio (this repository)
        uses: actions/checkout@v5

      - name: Checkout ${{ matrix.checkout_repo }}
        if: ${{ matrix.checkout_repo != '' }}
        uses: actions/checkout@v5
        with:
          repository: ${{ matrix.checkout_repo }}
          path: ${{ matrix.checkout_path }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/GitHubActionsRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build base image (original Dockerfile)
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64 \
            --file "${{ matrix.dockerfile }}" \
            --tag "chrisvouga-base:${{ matrix.id }}" \
            --load \
            "${{ matrix.build_context }}"

      - name: Wrap with AWS Lambda Web Adapter and push to ECR
        run: |
          set -euo pipefail
          REGISTRY="${{ steps.ecr.outputs.registry }}"
          REPO_URI="${REGISTRY}/${{ matrix.id }}"
          docker buildx build \
            --platform linux/amd64 \
            --file aws/lambda-wrapper.Dockerfile \
            --build-arg BASE_IMAGE="chrisvouga-base:${{ matrix.id }}" \
            --tag "${REPO_URI}:latest" \
            --tag "${REPO_URI}:${{ github.sha }}" \
            --provenance=false \
            --push \
            .
          echo "Pushed ${REPO_URI}:latest and ${REPO_URI}:${{ github.sha }}"

      - name: Roll out new image to Lambda
        run: |
          set -euo pipefail
          FN_NAME="chrisvouga-$(echo "${{ matrix.id }}" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9-' '-' | cut -c 1-40)"
          REGISTRY="${{ steps.ecr.outputs.registry }}"
          IMAGE_URI="${REGISTRY}/${{ matrix.id }}:${{ github.sha }}"
          if aws lambda get-function --function-name "$FN_NAME" --region "${AWS_REGION}" >/dev/null 2>&1; then
            aws lambda update-function-code \
              --function-name "$FN_NAME" \
              --image-uri "$IMAGE_URI" \
              --region "${AWS_REGION}" \
              --publish >/dev/null
            echo "Lambda $FN_NAME updated to $IMAGE_URI"
          else
            echo "Lambda $FN_NAME not found yet — skipping rollout (LambdaServicesStack must be deployed first)."
          fi
