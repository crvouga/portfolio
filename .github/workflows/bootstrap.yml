name: Bootstrap (Fly + Cloudflare)

# One-time / occasional manual workflow that prepares the infrastructure:
#   1) Ensure every Cloudflare zone in `projects.ts` exists (and prints
#      nameservers so the registrar can be pointed at Cloudflare).
#   2) Create any missing Fly apps and allocate IPv4/IPv6 addresses.
#
# Safe to re-run: every step is idempotent.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run zones, fly apps, or both."
        required: false
        type: choice
        options:
          - both
          - zones
          - apps
        default: both
      dry_run:
        description: "Plan only, do not mutate."
        required: false
        type: boolean
        default: false
      fly_org:
        description: "Fly organisation slug (defaults to 'personal')."
        required: false
        type: string
        default: personal

concurrency:
  group: bootstrap-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

jobs:
  cloudflare-zones:
    if: ${{ inputs.mode == 'zones' || inputs.mode == 'both' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - name: Ensure zones + print nameservers
        run: |
          set -euo pipefail
          ARGS=()
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS+=("--dry-run")
          fi
          bun run scripts/cloudflare/setup-zone.ts "${ARGS[@]}"

  fly-apps:
    if: ${{ always() && (inputs.mode == 'apps' || inputs.mode == 'both') && (needs.cloudflare-zones.result == 'success' || needs.cloudflare-zones.result == 'skipped') }}
    runs-on: ubuntu-latest
    needs: [cloudflare-zones]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Create Fly apps
        run: |
          set -euo pipefail
          ARGS=("--org" "${{ inputs.fly_org }}")
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS+=("--dry-run")
          fi
          bun run scripts/fly/bootstrap-apps.ts "${ARGS[@]}"
