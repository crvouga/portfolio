name: Deploy Pipeline

# 1) Reconcile Cloudflare DNS records against `projects.ts`.
# 2) Bootstrap any new Fly apps (idempotent — no-op when up to date).
# 3) Push secrets from GitHub repo into Fly apps.
# 4) Fan out per-target Fly deploys (image already on ghcr.io).
# 5) HTTP health-check every public URL.
# 6) Audit scale-to-zero compliance on every Fly app.
# 7) Tear down orphan Fly apps that no longer appear in `projects.ts`,
#    capped by `max_teardowns_per_run` for safety.

on:
  # Run the deploy AFTER `Build And Publish Images` finishes so the freshly
  # built image is on ghcr.io by the time Fly tries to pull it. Replaces the
  # previous `push` trigger which raced the build and frequently asked Fly to
  # pull a tag that didn't exist yet.
  workflow_run:
    workflows: ["Build And Publish Images"]
    types: [completed]
    branches: [main]
  # Push trigger for changes that don't require a rebuild (orchestrator
  # scripts, the Fly template, workflow itself). These deploys reuse the
  # current `:latest` images on ghcr.io.
  push:
    branches:
      - main
    paths:
      - "fly/fly.toml.template"
      - "scripts/fly/**"
      - "scripts/cloudflare/**"
      - "scripts/lib/**"
      - "scripts/health-check-urls.ts"
      - "scripts/check-github-secrets.ts"
      - ".github/workflows/deploy-pipeline.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy. Defaults to 'latest' (the most recent successful build)."
        required: false
        type: string
        default: "latest"
      project_id:
        description: "Deploy a single project id (matches `projects.ts`); leave blank to deploy all."
        required: false
        type: string
      apply_dns:
        description: "Apply Cloudflare DNS changes (uncheck for plan-only)."
        required: false
        type: boolean
        default: true
      force_teardown:
        description: "Bypass the max_teardowns_per_run safety cap (use only when intentionally removing many projects)."
        required: false
        type: boolean
        default: false
      max_teardowns_per_run:
        description: "Hard cap on Fly apps destroyed per run. Default 1; raise (or set force_teardown) for batch removals."
        required: false
        type: string
        default: "1"

concurrency:
  group: deploy-pipeline-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  # When triggered by `workflow_run`, the default GITHUB_REF is the branch
  # tip rather than the build's source SHA. Pin every checkout (and the image
  # tag) to the SHA the build actually used so the deploy-time projects.ts
  # matches the image set on ghcr.io.
  CHECKOUT_REF: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  # Skip everything if the upstream `Build And Publish Images` workflow failed
  # — there are no fresh images to deploy.
  guard:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - id: tag
        env:
          DISPATCH_TAG: ${{ inputs.image_tag }}
          BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          # Priority: explicit workflow_dispatch input → workflow_run head SHA
          # (newly-built image) → 'latest' fallback for plain push triggers.
          if [ -n "${DISPATCH_TAG:-}" ]; then
            TAG="$DISPATCH_TAG"
          elif [ -n "${BUILD_SHA:-}" ]; then
            TAG="$BUILD_SHA"
          else
            TAG="latest"
          fi
          echo "Resolved image tag: $TAG"
          echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"

  cloudflare-dns-sync:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: oven-sh/setup-bun@v2
      - name: Reconcile Cloudflare DNS
        run: |
          set -euo pipefail
          ARGS=()
          if [ "${{ inputs.apply_dns != false }}" = "true" ]; then
            ARGS+=("--apply")
          fi
          bun run scripts/cloudflare/sync-dns.ts "${ARGS[@]}"

  # Idempotently create Fly apps + IPs for every target in `projects.ts`.
  # Adding a brand-new project = one edit to projects.ts; this job creates the
  # Fly app on the very first deploy without any manual `fly apps create`.
  fly-bootstrap:
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: oven-sh/setup-bun@v2
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Bootstrap Fly apps + IPs
        run: bun run fly:bootstrap

  fly-secrets-sync:
    runs-on: ubuntu-latest
    needs: [guard, cloudflare-dns-sync, fly-bootstrap]
    env:
      # Pass the entire `secrets` context as JSON. `check-github-secrets.ts`
      # parses it, validates that every GitHub-sourced secret declared in
      # projects.ts is present, and re-exports each into $GITHUB_ENV for the
      # follow-up sync step. Adding a new secret is now: add it to the repo
      # secrets, reference it in projects.ts. No YAML edit needed.
      ALL_GITHUB_SECRETS: ${{ toJSON(secrets) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: oven-sh/setup-bun@v2
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Validate + re-export GitHub-sourced secrets
        run: bun run scripts/check-github-secrets.ts
      - name: Push secrets to Fly apps
        run: |
          set -euo pipefail
          ARGS=()
          if [ -n "${{ inputs.project_id }}" ]; then
            ARGS+=("--id" "${{ inputs.project_id }}")
          fi
          bun run scripts/fly/sync-secrets.ts "${ARGS[@]}"

  configure:
    runs-on: ubuntu-latest
    needs: [guard, fly-secrets-sync]
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: oven-sh/setup-bun@v2
      - id: matrix
        env:
          PROJECT_ID: ${{ inputs.project_id }}
          GHCR_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          MATRIX=$(bun run scripts/generate-deploy-matrix.ts --owner "$GHCR_OWNER")
          if [ -n "${PROJECT_ID:-}" ]; then
            MATRIX=$(echo "$MATRIX" | jq --arg pid "$PROJECT_ID" '.include |= map(select(.id == $pid))')
            COUNT=$(echo "$MATRIX" | jq '.include | length')
            if [ "$COUNT" = "0" ]; then
              echo "::error::No project matched id: $PROJECT_ID"
              exit 1
            fi
          fi
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  fly-deploy:
    runs-on: ubuntu-latest
    needs: [guard, configure]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.configure.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: oven-sh/setup-bun@v2
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy ${{ matrix.id }} to Fly
        env:
          IMAGE_TAG: ${{ needs.guard.outputs.image_tag }}
        run: |
          set -euo pipefail
          bun run scripts/fly/deploy-app.ts \
            --id "${{ matrix.id }}" \
            --image "${{ matrix.image_repo }}:${IMAGE_TAG}"

  health-check:
    runs-on: ubuntu-latest
    needs: fly-deploy
    if: ${{ always() && needs.fly-deploy.result != 'cancelled' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: oven-sh/setup-bun@v2
      - name: Health-check public URLs
        # Scale-to-zero Fly apps need a sequential warmup + long per-URL
        # timeouts with retries. A fixed sleep + 10s fetch was failing on
        # cold starts (normalizer, moviefinder-clojurescript, etc.).
        run: |
          bun run scripts/health-check-urls.ts \
            --warmup-timeout-ms 180000 \
            --fly-timeout-ms 120000 \
            --fly-retries 8 \
            --retry-delay-ms 8000

  # Verify every Fly app actually has scale-to-zero settings applied to its
  # live machines. Catches dashboard-edits, leftover HA pairs from older
  # deploys, and any drift in the [http_service] block. Runs even if
  # fly-deploy partially failed so we still get a current state snapshot.
  scale-to-zero-audit:
    runs-on: ubuntu-latest
    needs: fly-deploy
    if: ${{ always() && needs.fly-deploy.result != 'cancelled' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: oven-sh/setup-bun@v2
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Audit scale-to-zero compliance
        run: bun run fly:audit-scale

  # Destroy Fly apps that no longer appear in `projects.ts` — same idea as
  # `cloudflare-dns-sync` but for compute. Capped at `max_teardowns_per_run`
  # (default 1) so an accidental mass-delete in a PR doesn't take down the
  # whole org. To remove >1 in a single PR, run via workflow_dispatch with
  # `force_teardown: true` or raise the cap. Runs only after a successful
  # deploy to avoid destroying live apps when something else broke.
  fly-teardown:
    runs-on: ubuntu-latest
    needs: fly-deploy
    if: ${{ always() && needs.fly-deploy.result == 'success' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: oven-sh/setup-bun@v2
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Tear down orphan Fly apps
        env:
          MAX_TEARDOWNS: ${{ inputs.max_teardowns_per_run || '1' }}
          FORCE_TEARDOWN: ${{ inputs.force_teardown || 'false' }}
        run: |
          set -euo pipefail
          ARGS=("--apply" "--max-destroys" "${MAX_TEARDOWNS}")
          if [ "${FORCE_TEARDOWN}" = "true" ]; then
            ARGS+=("--force")
          fi
          # `--json` makes orphans + outcomes show up clearly in the run log
          # and is `jq`-friendly if anyone wants to wire up a summary later.
          bun run scripts/fly/teardown-apps.ts "${ARGS[@]}" --json
