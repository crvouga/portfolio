name: Deploy Pipeline

# Portfolio site CI — images deploy via chrisvouga.dev single-node stack.
# Image publishing: .github/workflows/publish-image.yml
# Fly teardown (post-migration): .github/workflows/fly-teardown.yml

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "public/**"
      - ".vscode/**"
      - ".cursor/**"
      - ".gitignore"
      - ".editorconfig"
  workflow_dispatch:

concurrency:
  group: deploy-pipeline-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  health-check:
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Health-check public URLs
        run: |
          bun run health-check-urls \
            --no-warmup \
            --timeout-ms 30000 \
            --retries 4 \
            --retry-delay-ms 5000
