name: Deploy Pipeline

# 1) Reconcile Cloudflare DNS records against `projects.ts`.
# 2) Push secrets from GitHub repo into Fly apps.
# 3) Fan out per-target Fly deploys (image already on ghcr.io).
# 4) HTTP health-check every public URL.

on:
  push:
    branches:
      - main
    paths:
      - "projects.ts"
      - "fly/fly.toml.template"
      - "scripts/fly/**"
      - "scripts/cloudflare/**"
      - "scripts/lib/**"
      - "scripts/generate-deploy-matrix.ts"
      - "scripts/health-check-urls.ts"
      - ".github/workflows/deploy-pipeline.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (defaults to current commit SHA)."
        required: false
        type: string
      project_id:
        description: "Deploy a single project id (matches `projects.ts`); leave blank to deploy all."
        required: false
        type: string
      apply_dns:
        description: "Apply Cloudflare DNS changes (uncheck for plan-only)."
        required: false
        type: boolean
        default: true

concurrency:
  group: deploy-pipeline-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  cloudflare-dns-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - name: Reconcile Cloudflare DNS
        run: |
          set -euo pipefail
          ARGS=()
          if [ "${{ inputs.apply_dns != false }}" = "true" ]; then
            ARGS+=("--apply")
          fi
          bun run scripts/cloudflare/sync-dns.ts "${ARGS[@]}"

  fly-secrets-sync:
    runs-on: ubuntu-latest
    needs: cloudflare-dns-sync
    env:
      TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      TWILIO_SERVICE_SID: ${{ secrets.TWILIO_SERVICE_SID }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Push secrets to Fly apps
        run: |
          set -euo pipefail
          ARGS=()
          if [ -n "${{ inputs.project_id }}" ]; then
            ARGS+=("--id" "${{ inputs.project_id }}")
          fi
          bun run scripts/fly/sync-secrets.ts "${ARGS[@]}"

  configure:
    runs-on: ubuntu-latest
    needs: fly-secrets-sync
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - id: matrix
        env:
          PROJECT_ID: ${{ inputs.project_id }}
          GHCR_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          MATRIX=$(bun run scripts/generate-deploy-matrix.ts --owner "$GHCR_OWNER")
          if [ -n "${PROJECT_ID:-}" ]; then
            MATRIX=$(echo "$MATRIX" | jq --arg pid "$PROJECT_ID" '.include |= map(select(.id == $pid))')
            COUNT=$(echo "$MATRIX" | jq '.include | length')
            if [ "$COUNT" = "0" ]; then
              echo "::error::No project matched id: $PROJECT_ID"
              exit 1
            fi
          fi
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  fly-deploy:
    runs-on: ubuntu-latest
    needs: configure
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.configure.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy ${{ matrix.id }} to Fly
        env:
          IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
        run: |
          set -euo pipefail
          bun run scripts/fly/deploy-app.ts \
            --id "${{ matrix.id }}" \
            --image "${{ matrix.image_repo }}:${IMAGE_TAG}"

  health-check:
    runs-on: ubuntu-latest
    needs: fly-deploy
    if: ${{ always() && needs.fly-deploy.result != 'cancelled' }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - name: Wait for Fly machines + cert
        run: sleep 30
      - name: Health-check public URLs
        run: bun run scripts/health-check-urls.ts
