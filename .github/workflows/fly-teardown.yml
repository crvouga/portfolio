name: Fly teardown

# Destroys migrated chrisvouga-* Fly apps (mode=known) after the DO stack is healthy.
# Idempotent: succeeds when apps are already gone. Never touches vault-chrisvouga.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "known = destroy apps in projects.ts; orphans = stale apps no longer listed"
        required: false
        type: choice
        options:
          - known
          - orphans
        default: known
      force_teardown:
        description: "Bypass the max_teardowns_per_run safety cap."
        required: false
        type: boolean
        default: true
      max_teardowns_per_run:
        description: "Hard cap on Fly apps destroyed per run."
        required: false
        type: string
        default: "20"

permissions:
  id-token: write
  contents: read

jobs:
  teardown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - uses: ./.github/actions/vault-secrets
      - run: bun install --frozen-lockfile
      - name: Tear down Fly apps
        env:
          MAX_TEARDOWNS: ${{ inputs.max_teardowns_per_run }}
          FORCE_TEARDOWN: ${{ inputs.force_teardown }}
          TEARDOWN_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          ARGS=(--apply --mode "${TEARDOWN_MODE}" --max-destroys "${MAX_TEARDOWNS}" --json)
          if [ "${FORCE_TEARDOWN}" = "true" ]; then ARGS+=("--force"); fi
          bun run fly:teardown -- "${ARGS[@]}"
