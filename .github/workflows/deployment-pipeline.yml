name: Deployment Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Rebuild and push all container images even if unchanged
        type: boolean
        default: false

concurrency:
  group: deployment-pipeline-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  pull-requests: write
  actions: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Type check
        run: bun run typecheck

  changes:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      portfolio: ${{ steps.filter.outputs.portfolio }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Detect portfolio file changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            portfolio:
              - Dockerfile
              - src/**
              - package.json
              - bun.lock
              - tsconfig.json
              - public/**

  build-and-push:
    runs-on: ubuntu-latest
    needs: [typecheck, changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: portfolio
            checkout_repo: ""
            checkout_path: "."
            build_context: "."
            dockerfile: "./Dockerfile"
          - id: normalizer-app
            checkout_repo: crvouga/normalizer.app
            checkout_path: projects/normalizer.app
            build_context: projects/normalizer.app
            dockerfile: projects/normalizer.app/Dockerfile
          - id: pickflix
            checkout_repo: crvouga/pickflix-v1
            checkout_path: projects/pickflix-v1
            build_context: projects/pickflix-v1
            dockerfile: projects/pickflix-v1/Dockerfile
          - id: headless-combobox-docs
            checkout_repo: crvouga/headless-combobox
            checkout_path: projects/headless-combobox
            build_context: projects/headless-combobox
            dockerfile: projects/headless-combobox/Dockerfile
          - id: headless-combobox-svelte-example
            checkout_repo: crvouga/headless-combobox
            checkout_path: projects/headless-combobox
            build_context: projects/headless-combobox/example/svelte
            dockerfile: projects/headless-combobox/example/svelte/Dockerfile
          - id: moviefinder-app-rust
            checkout_repo: crvouga/moviefinder.app-rust
            checkout_path: projects/moviefinder.app-rust
            build_context: projects/moviefinder.app-rust
            dockerfile: projects/moviefinder.app-rust/Dockerfile
          - id: moviefinder-app-go
            checkout_repo: crvouga/moviefinder.app-go
            checkout_path: projects/moviefinder.app-go
            build_context: projects/moviefinder.app-go
            dockerfile: projects/moviefinder.app-go/Dockerfile
          - id: moviefinder-app-react
            checkout_repo: crvouga/moviefinder.app-react
            checkout_path: projects/moviefinder.app-react
            build_context: projects/moviefinder.app-react
            dockerfile: projects/moviefinder.app-react/Dockerfile
          - id: moviefinder-app-clojurescript
            checkout_repo: crvouga/moviefinder.app-clojurescript
            checkout_path: projects/moviefinder.app-clojurescript
            build_context: projects/moviefinder.app-clojurescript
            dockerfile: projects/moviefinder.app-clojurescript/Dockerfile
          - id: todo-app
            checkout_repo: crvouga/todo-v1
            checkout_path: projects/todo-v1
            build_context: projects/todo-v1
            dockerfile: projects/todo-v1/Dockerfile
          - id: image-service
            checkout_repo: crvouga/image-service
            checkout_path: projects/image-service
            build_context: projects/image-service
            dockerfile: projects/image-service/Dockerfile
          - id: connect-four
            checkout_repo: crvouga/connect-four
            checkout_path: projects/connect-four
            build_context: projects/connect-four
            dockerfile: projects/connect-four/Dockerfile
          - id: screenshot-service
            checkout_repo: crvouga/screenshot-service
            checkout_path: projects/screenshot-service
            build_context: projects/screenshot-service
            dockerfile: projects/screenshot-service/Dockerfile
          - id: anime-blog
            checkout_repo: crvouga/anime
            checkout_path: projects/anime
            build_context: projects/anime
            dockerfile: projects/anime/Dockerfile
          - id: snake-game
            checkout_repo: crvouga/snake
            checkout_path: projects/snake
            build_context: projects/snake
            dockerfile: projects/snake/Dockerfile
          - id: match-three
            checkout_repo: crvouga/match-three
            checkout_path: projects/match-three
            build_context: projects/match-three
            dockerfile: projects/match-three/Dockerfile
          - id: simon-says
            checkout_repo: crvouga/simon-says
            checkout_path: projects/simon-says
            build_context: projects/simon-says
            dockerfile: projects/simon-says/Dockerfile
          - id: quiz-maker
            checkout_repo: crvouga/quiz-maker
            checkout_path: projects/quiz-maker
            build_context: projects/quiz-maker
            dockerfile: projects/quiz-maker/Dockerfile
          - id: smart-dog-door
            checkout_repo: crvouga/smart-dog-door-python
            checkout_path: projects/smart-dog-door-python
            build_context: projects/smart-dog-door-python
            dockerfile: projects/smart-dog-door-python/Dockerfile

    steps:
      - name: Checkout portfolio (this repository)
        if: ${{ matrix.id == 'portfolio' }}
        uses: actions/checkout@v5

      - name: Checkout ${{ matrix.checkout_repo }}
        if: ${{ matrix.id != 'portfolio' }}
        uses: actions/checkout@v5
        with:
          repository: ${{ matrix.checkout_repo }}
          path: ${{ matrix.checkout_path }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Decide whether to build
        id: should_build
        env:
          GHCR_IMAGE: ghcr.io/${{ github.repository }}
          CHECKOUT_REPO: ${{ matrix.checkout_repo }}
          CHECKOUT_PATH: ${{ matrix.checkout_path }}
          PORTFOLIO_CHANGED: ${{ needs.changes.outputs.portfolio }}
          FORCE_REBUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.force_rebuild }}
        run: |
          GHCR_IMAGE=$(echo "$GHCR_IMAGE" | tr '[:upper:]' '[:lower:]')
          TAG="${{ matrix.id }}"

          if [ "$FORCE_REBUILD" = "true" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "reason=force_rebuild" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$CHECKOUT_REPO" ]; then
            if [ "$PORTFOLIO_CHANGED" != "true" ]; then
              echo "build=false" >> "$GITHUB_OUTPUT"
              echo "reason=portfolio paths unchanged" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            CONTENT_SHA="${{ github.sha }}"
          else
            CONTENT_SHA=$(git -C "$CHECKOUT_PATH" rev-parse HEAD)
          fi

          echo "content_sha=${CONTENT_SHA}" >> "$GITHUB_OUTPUT"

          if docker buildx imagetools inspect "${GHCR_IMAGE}:${TAG}-${CONTENT_SHA}" >/dev/null 2>&1; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "reason=image ${TAG}-${CONTENT_SHA} already in GHCR" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "build=true" >> "$GITHUB_OUTPUT"
          echo "reason=new content ${CONTENT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Skip build (unchanged)
        if: steps.should_build.outputs.build != 'true'
        run: echo "Skipping ${{ matrix.id }} — ${{ steps.should_build.outputs.reason }}"

      - name: Build and push
        id: build
        if: steps.should_build.outputs.build == 'true'
        env:
          GHCR_IMAGE: ghcr.io/${{ github.repository }}
          CONTENT_SHA: ${{ steps.should_build.outputs.content_sha }}
        run: |
          GHCR_IMAGE=$(echo "$GHCR_IMAGE" | tr '[:upper:]' '[:lower:]')
          docker buildx build \
            --platform linux/amd64 \
            --file "${{ matrix.dockerfile }}" \
            --tag "${GHCR_IMAGE}:${{ matrix.id }}-latest" \
            --tag "${GHCR_IMAGE}:${{ matrix.id }}-${CONTENT_SHA}" \
            --push \
            "${{ matrix.build_context }}"
          echo "image=${GHCR_IMAGE}:${{ matrix.id }}-latest" >> "$GITHUB_OUTPUT"

  deploy-cloudflare:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install root dependencies
        run: bun install

      - name: Generate Cloudflare config
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_SECRETS_STORE_ID: ${{ secrets.CLOUDFLARE_SECRETS_STORE_ID }}
        run: bun run generate-cloudflare

      - name: Install Cloudflare worker dependencies
        working-directory: cloudflare
        run: bun install

      # GitHub repo secrets are the source of truth; seed Cloudflare Secrets Store before deploy.
      - name: Seed Cloudflare Secrets Store from GitHub secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_SECRETS_STORE_ID: ${{ secrets.CLOUDFLARE_SECRETS_STORE_ID }}
          # BEGIN GENERATED: cloudflare-github-secrets-env
          TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_SERVICE_SID: ${{ secrets.TWILIO_SERVICE_SID }}
          # END GENERATED: cloudflare-github-secrets-env
        run: bun run setup-cloudflare-secrets

      - name: Deploy to Cloudflare
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy

  summary:
    runs-on: ubuntu-latest
    needs: [typecheck, build-and-push, deploy-cloudflare]
    if: always()
    steps:
      - name: Publish summary
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          BUILD_RESULT: ${{ needs.build-and-push.result }}
          DEPLOY_RESULT: ${{ needs.deploy-cloudflare.result }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          OWNER=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA="${SHA:0:7}"
          IS_MAIN_PUSH=false
          if [ "$EVENT" = "push" ] && [ "$REF" = "refs/heads/main" ]; then
            IS_MAIN_PUSH=true
          fi

          pipeline_failed=false
          for result in "$TYPECHECK_RESULT" "$BUILD_RESULT" "$DEPLOY_RESULT"; do
            case "$result" in
              failure|cancelled) pipeline_failed=true ;;
            esac
          done

          fetch_cloudflare_nameservers() {
            zone="$1"
            if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
              echo "_CLOUDFLARE_API_TOKEN not set — add repo secret to show nameservers here_"
              return
            fi
            account_args=()
            if [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
              account_args=(--data-urlencode "account.id=${CLOUDFLARE_ACCOUNT_ID}")
            fi
            response=$(curl -fsS -G "https://api.cloudflare.com/client/v4/zones" \
              "${account_args[@]}" \
              --data-urlencode "name=${zone}" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" 2>/dev/null || true)
            if [ -z "$response" ]; then
              echo "_API request failed_"
              return
            fi
            status=$(echo "$response" | jq -r '.success')
            if [ "$status" != "true" ]; then
              echo "_$(echo "$response" | jq -r '.errors[0].message // "zone lookup failed"')_"
              return
            fi
            count=$(echo "$response" | jq -r '.result | length')
            if [ "$count" = "0" ]; then
              echo "_Zone \`${zone}\` not found — add it in [Cloudflare DNS](https://dash.cloudflare.com/) first_"
              return
            fi
            echo "$response" | jq -r '.result[0].name_servers[]' | while read -r ns; do
              echo "- \`${ns}\`"
            done
          }

          write_failure_diagnostics() {
            echo "## Pipeline status"
            echo ""
            echo "| Job | Result |"
            echo "|-----|--------|"
            echo "| typecheck | \`${TYPECHECK_RESULT}\` |"
            echo "| build-and-push | \`${BUILD_RESULT}\` |"
            echo "| deploy-cloudflare | \`${DEPLOY_RESULT}\` |"
            echo ""
            echo "**Workflow run:** [${RUN_ID}](${RUN_URL}) · commit \`${SHORT_SHA}\` · \`${EVENT}\` on \`${REF#refs/heads/}\`"
            echo ""

            failed_jobs_md=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/jobs" --paginate \
              --jq '[.jobs[] | select(.conclusion == "failure") | {name, html_url, steps: [.steps[] | select(.conclusion == "failure") | .name]}] | .[] | "- **\(.name)** — [view logs](\(.html_url))" + (if (.steps | length) > 0 then "\n  - Failed steps: " + ([.steps[] | "`\(.)`"] | join(", ")) else "" end)' \
              2>/dev/null || echo "- _Could not fetch failed jobs from GitHub API_")

            failed_job_count=$(printf '%s\n' "$failed_jobs_md" | grep -c '^\- \*\*' || true)

            logs_file=$(mktemp)
            if ! gh run view "$RUN_ID" --repo "$REPO" --log-failed > "$logs_file" 2>/dev/null; then
              echo "_Could not download failed-step logs (run may still be finalizing)._ " > "$logs_file"
            fi
            # Keep prompt size reasonable for LLMs and GitHub summary limits
            tail -n 400 "$logs_file" > "${logs_file}.tail"
            mv "${logs_file}.tail" "$logs_file"
            if [ "$(wc -c < "$logs_file" | tr -d ' ')" -gt 24000 ]; then
              head -c 24000 "$logs_file" > "${logs_file}.trim"
              printf '\n\n... [logs truncated — open workflow run for full output]\n' >> "${logs_file}.trim"
              mv "${logs_file}.trim" "$logs_file"
            fi

            echo "<details>"
            echo "<summary><strong>Failed jobs</strong> (${failed_job_count}) — click to expand</summary>"
            echo ""
            echo "$failed_jobs_md"
            echo ""
            echo "</details>"
            echo ""

            echo "<details>"
            echo "<summary><strong>Failed step logs</strong> (truncated) — click to expand, use code-block copy button</summary>"
            echo ""
            echo '```text'
            cat "$logs_file"
            echo '```'
            echo ""
            echo "</details>"
            echo ""

            prompt_file=$(mktemp)
            {
              echo "Fix this GitHub Actions deployment pipeline failure."
              echo ""
              echo "## Context"
              echo "- Repository: ${REPO}"
              echo "- Workflow: Deployment Pipeline (.github/workflows/deployment-pipeline.yml)"
              echo "- Run: ${RUN_URL}"
              echo "- Event: ${EVENT}"
              echo "- Ref: ${REF}"
              echo "- Commit: ${SHA}"
              echo ""
              echo "## Job results"
              echo "- typecheck: ${TYPECHECK_RESULT}"
              echo "- build-and-push: ${BUILD_RESULT}"
              echo "- deploy-cloudflare: ${DEPLOY_RESULT}"
              echo ""
              echo "## Failed jobs"
              printf '%s\n' "$failed_jobs_md" | sed 's/\[\([^]]*\)\]([^)]*)/\1/g' | sed 's/\*\*//g'
              echo ""
              echo "## Failed step logs (truncated)"
              cat "$logs_file"
              echo ""
              echo "## Your task"
              echo "1. Identify the root cause from the logs above."
              echo "2. Propose a minimal fix (file paths and exact edits)."
              echo "3. Note if the failure is in an external repo checked out in the matrix (see workflow matrix.checkout_repo)."
              echo "4. Call out missing secrets or infra (GitHub repo secrets are source of truth — binding names like PICKFLIX__DATABASE_URL; CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, GHCR permissions) if relevant."
            } > "$prompt_file"

            echo "<details open>"
            echo "<summary><strong>Copy-paste LLM prompt</strong> — expand, hover the code block, click the copy icon (top-right)</summary>"
            echo ""
            echo "_Paste the entire block below into Cursor, ChatGPT, or Claude._"
            echo ""
            echo '```text'
            cat "$prompt_file"
            echo '```'
            echo ""
            echo "</details>"

            rm -f "$logs_file" "$prompt_file"
          }

          {
            if [ "$pipeline_failed" = "true" ]; then
              echo "# Deployment pipeline failed"
              echo ""
              write_failure_diagnostics
              echo "---"
              echo ""
            fi

            if [ "$IS_MAIN_PUSH" = "true" ] && [ "$BUILD_RESULT" != "skipped" ]; then
              echo "## Container Images"
              echo ""
              echo "| Image | Tags | Pull | URL |"
              echo "|-------|------|------|-----|"

              print_row() {
                id="$1"
                host="$2"
                image="${REPO}"
                echo "| \`${id}\` | \`${id}-latest\` \`${id}-${SHORT_SHA}\` | \`docker pull ghcr.io/${image}:${id}-latest\` | https://${host} |"
              }

              print_row portfolio                       www.chrisvouga.dev
              print_row normalizer-app                  normalizer.app
              print_row pickflix                        pickflix.chrisvouga.dev
              print_row headless-combobox-docs          headlesscombobox.chrisvouga.dev
              print_row headless-combobox-svelte-example svelte.headlesscombobox.chrisvouga.dev
              print_row moviefinder-app-rust            moviefinder-app-rust.chrisvouga.dev
              print_row moviefinder-app-go              moviefinder-app-go.chrisvouga.dev
              print_row moviefinder-app-react           moviefinder-app-react.chrisvouga.dev
              print_row moviefinder-app-clojurescript   moviefinder-app-clojurescript.chrisvouga.dev
              print_row todo-app                        todo.chrisvouga.dev
              print_row image-service                   imageservice.chrisvouga.dev
              print_row connect-four                    connectfour.chrisvouga.dev
              print_row screenshot-service              screenshotservice.chrisvouga.dev
              print_row anime-blog                      anime.chrisvouga.dev
              print_row snake-game                      snake.chrisvouga.dev
              print_row match-three                     matchthree.chrisvouga.dev
              print_row simon-says                      simonsays.chrisvouga.dev
              print_row quiz-maker                      quizmaker.chrisvouga.dev
              print_row smart-dog-door                  smartdogdoor.chrisvouga.dev

              echo ""
              echo "## Squarespace → Cloudflare nameservers"
              echo ""
              echo "Custom domains use \`custom_domain = true\` in Wrangler, which creates DNS records **inside Cloudflare**. Squarespace must delegate each apex domain to Cloudflare nameservers (not individual A/CNAME rows in Squarespace)."
              echo ""
              echo "### 1. \`chrisvouga.dev\` (18 subdomains + \`www\`)"
              echo ""
              echo "**Cloudflare nameservers for this zone:**"
              fetch_cloudflare_nameservers "chrisvouga.dev"
              echo ""
              echo "**Squarespace:** [Domains](https://account.squarespace.com/domains) → \`chrisvouga.dev\` → **DNS** → **Nameservers** → **Use custom nameservers** → paste every nameserver above (usually 2)."
              echo ""
              echo "**Hostnames auto-managed in Cloudflare after delegation:**"
              echo "- \`www.chrisvouga.dev\`"
              echo "- \`pickflix.chrisvouga.dev\`"
              echo "- \`svelte.headlesscombobox.chrisvouga.dev\`"
              echo "- \`headlesscombobox.chrisvouga.dev\`"
              echo "- \`todo.chrisvouga.dev\`"
              echo "- \`imageservice.chrisvouga.dev\`"
              echo "- \`connectfour.chrisvouga.dev\`"
              echo "- \`screenshotservice.chrisvouga.dev\`"
              echo "- \`smartdogdoor.chrisvouga.dev\`"
              echo "- \`quizmaker.chrisvouga.dev\`"
              echo "- \`anime.chrisvouga.dev\`"
              echo "- \`snake.chrisvouga.dev\`"
              echo "- \`matchthree.chrisvouga.dev\`"
              echo "- \`moviefinder-app-rust.chrisvouga.dev\`"
              echo "- \`moviefinder-app-go.chrisvouga.dev\`"
              echo "- \`moviefinder-app-react.chrisvouga.dev\`"
              echo "- \`moviefinder-app-clojurescript.chrisvouga.dev\`"
              echo "- \`simonsays.chrisvouga.dev\`"
              echo ""
              echo "> Optional: add a Cloudflare redirect rule \`chrisvouga.dev\` → \`https://www.chrisvouga.dev\` if you want the bare apex to work."
              echo ""
              echo "### 2. \`normalizer.app\` (apex only)"
              echo ""
              echo "**Cloudflare nameservers for this zone:**"
              fetch_cloudflare_nameservers "normalizer.app"
              echo ""
              echo "**Squarespace:** [Domains](https://account.squarespace.com/domains) → \`normalizer.app\` → **DNS** → **Nameservers** → **Use custom nameservers** → paste every nameserver above."
              echo ""
              echo "**Hostname auto-managed in Cloudflare after delegation:**"
              echo "- \`normalizer.app\`"
              echo ""
              echo "### Checklist"
              echo ""
              echo "1. Both zones exist in [Cloudflare](https://dash.cloudflare.com/) under account \`${CLOUDFLARE_ACCOUNT_ID:-<set CLOUDFLARE_ACCOUNT_ID secret>}\`."
              echo "2. Squarespace nameservers match the values listed above (propagation can take up to 48h)."
              echo "3. Do **not** keep Squarespace DNS records for these hostnames — Cloudflare owns DNS once nameservers are switched."
              echo "4. Re-run this workflow summary after any zone transfer to refresh nameserver values."
            elif [ "$pipeline_failed" != "true" ]; then
              echo "## Pipeline succeeded"
              echo ""
              echo "| Job | Result |"
              echo "|-----|--------|"
              echo "| typecheck | \`${TYPECHECK_RESULT}\` |"
              echo "| build-and-push | \`${BUILD_RESULT}\` |"
              echo "| deploy-cloudflare | \`${DEPLOY_RESULT}\` |"
            fi

            if [ "$IS_MAIN_PUSH" = "true" ] || [ "$pipeline_failed" = "true" ]; then
              echo ""
              echo "**Typecheck:** \`${TYPECHECK_RESULT}\` · **Build:** \`${BUILD_RESULT}\` · **Deploy:** \`${DEPLOY_RESULT}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$pipeline_failed" = "true" ]; then
            exit 1
          fi
