name: Deployment Pipeline

on:
  push:
    branches:
      - main
    paths:
      - "aws/**"
      - "projects.ts"
      - "scripts/health-check-urls.ts"
      - ".github/workflows/deployment-pipeline.yml"
  workflow_dispatch:
    inputs:
      stacks:
        description: "Optional space-separated list of stacks to deploy (default: all)."
        required: false
        type: string
      run_health_check:
        description: "Run public-URL health check after deploy."
        required: false
        type: boolean
        default: true

concurrency:
  group: deployment-pipeline-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  deploy-aws:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Install AWS dependencies
        working-directory: aws
        run: npm ci

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/GitHubActionsRole
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK synth
        working-directory: aws
        env:
          CDK_DEFAULT_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}
        run: npx cdk synth --quiet

      - name: CDK deploy
        working-directory: aws
        env:
          CDK_DEFAULT_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}
          STACKS: ${{ inputs.stacks || '--all' }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          npx cdk deploy ${STACKS} \
            --require-approval never \
            --concurrency 4 \
            --outputs-file ../cdk-outputs.json

      - name: Append CDK outputs to job summary
        if: always()
        run: |
          if [ -f cdk-outputs.json ]; then
            echo '## CDK outputs' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat cdk-outputs.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Health check public URLs
        if: ${{ inputs.run_health_check != false }}
        run: bun run scripts/health-check-urls.ts
